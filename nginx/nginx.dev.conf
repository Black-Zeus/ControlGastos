# Proxy reverso para desarrollo — Vite dev server con HMR WebSocket.
# Frontend en :5173 (interno), backend en :8000 (interno).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # DNS embebido de Docker — re-resuelve los hostnames de los upstreams
    # en cada conexión (TTL corto) en vez de cachear la IP para siempre.
    # Sin esto, si backend/frontend se reinician y cambian de IP interna
    # (frecuente en dev), nginx sigue apuntando a la IP vieja hasta
    # recargarlo a mano (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s;

    # API FastAPI
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Frontend Vite + HMR WebSocket (Upgrade necesario para hot-reload)
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_cache_bypass          $http_upgrade;
        proxy_read_timeout          86400s;
    }
}
