# Proxy reverso para QA y PRD.
# Enruta /api/ → backend y / → frontend.

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Panel de administración — superficie de máximo privilegio, restringida
    # a la red local y a la red de Tailscale como defensa en profundidad
    # adicional a la autenticación de la aplicación.
    location /api/v1/admin/ {
        allow 192.168.3.0/24;
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        # El backend ya agrega estas cabeceras a sus propias respuestas;
        # aquí cubrimos el HTML/JS estático del frontend, que antes salía sin ellas.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
