# Proxy reverso para QA y PRD.
# Enruta /api/ → backend y / → frontend.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # DNS embebido de Docker — re-resuelve los hostnames de los upstreams
    # en cada conexión (TTL corto) en vez de cachear la IP para siempre.
    # Sin esto, si backend/frontend se reinician y cambian de IP interna,
    # nginx sigue apuntando a la IP vieja hasta recargarlo a mano
    # (502 Bad Gateway / "Connection refused" en el log de error).
    resolver 127.0.0.11 valid=10s;

    # Panel de administración — superficie de máximo privilegio, restringida
    # a la red local y a la red de Tailscale como defensa en profundidad
    # adicional a la autenticación de la aplicación.
    location /api/v1/admin/ {
        allow 192.168.3.0/24;
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        # Redes internas de Docker — permite probar el stack de PRD/QA en
        # local, donde nginx ve al cliente como el gateway del bridge
        # (ej. 172.18.0.1), no como la IP real de la LAN.
        allow 172.16.0.0/12;
        deny all;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        # El backend ya agrega estas cabeceras a sus propias respuestas;
        # aquí cubrimos el HTML/JS estático del frontend, que antes salía sin ellas.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
