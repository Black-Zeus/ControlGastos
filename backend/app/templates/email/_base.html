{% import "_components.html" as c %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ subject }}</title>
  <style>
    @media only screen and (max-width: 640px) {
      .email-shell { width:100% !important; border-radius:0 !important; }
      .content-padding { padding-left:24px !important; padding-right:24px !important; }
      .stack-column { display:block !important; width:100% !important; max-width:100% !important; }
      .hero-image { padding-top:28px !important; text-align:center !important; }
      .hero-title { font-size:28px !important; line-height:36px !important; }
      .cta-button { width:100% !important; box-sizing:border-box !important; }
      .footer-columns { display:block !important; width:100% !important; }
      .fallback-box { margin-top:22px !important; border-left:none !important; padding-left:0 !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#f3f5fb; font-family:Arial, Helvetica, sans-serif; color:#17213a;">

  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    {% block preheader %}{% endblock %}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5fb;">
    <tr>
      <td align="center" style="padding:38px 14px;">
        <table role="presentation" class="email-shell" width="680" cellpadding="0" cellspacing="0" style="width:680px; max-width:680px; background:#ffffff; border-radius:22px; overflow:hidden; box-shadow:0 20px 55px rgba(31, 41, 80, 0.14);">

          {{ c.header(header_label | default('Notificación')) }}

          {% block body %}{% endblock %}

          {{ c.trust_band() }}
          {{ c.footer_legal() }}

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
