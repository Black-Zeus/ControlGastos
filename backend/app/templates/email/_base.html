<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{ subject }}</title>
<style>
  body{margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827}
  .wrap{max-width:560px;margin:32px auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .header{background:#6366f1;padding:24px 32px;text-align:center}
  .header-logo{display:inline-flex;align-items:center;gap:12px}
  .header-logo img{width:48px;height:48px;border-radius:10px;background:#fff;padding:4px;display:block}
  .header h1{margin:0;font-size:18px;font-weight:700;color:#ffffff;letter-spacing:-.3px}
  .body{padding:32px}
  .body p{margin:0 0 16px;font-size:14px;line-height:1.6;color:#374151}
  .body p.muted{color:#6b7280;font-size:12px}
  .btn{display:inline-block;margin:8px 0 20px;padding:12px 28px;background:#6366f1;color:#ffffff !important;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;letter-spacing:-.1px}
  .btn:hover{background:#4f46e5}
  .divider{border:none;border-top:1px solid #f3f4f6;margin:24px 0}
  .footer{background:#f9fafb;padding:18px 32px;text-align:center;font-size:11px;color:#9ca3af;border-top:1px solid #f3f4f6}
  .alert{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;font-size:13px;color:#92400e;margin:0 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-logo">
      <img src="cid:logo" alt="ControlGastos" width="48" height="48"/>
      <h1>ControlGastos</h1>
    </div>
  </div>
  <div class="body">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    Este mensaje fue generado automáticamente · ControlGastos<br>
    Por favor no respondas a este correo.
  </div>
</div>
</body>
</html>
